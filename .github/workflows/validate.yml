name: Validate
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Python and JSON
        run: |
          python -m compileall -q custom_components
          python -m json.tool custom_components/tracearr_ha/manifest.json > /dev/null
          python -m json.tool hacs.json > /dev/null
      - name: Test pure data model
        run: |
          pip install pytest aiohttp
          pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JS
        run: |
          node --check custom_components/tracearr_ha/frontend/tracearr-card.js
          node --test tests/test_carousel.cjs tests/test_card_i18n.cjs

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Valider le dépôt HACS
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider avec hassfest
        uses: home-assistant/actions/hassfest@master
